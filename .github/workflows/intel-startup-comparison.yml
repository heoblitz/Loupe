name: Intel simulator startup comparison

on:
  push:
    branches: [feature/ci-intel-startup-comparison-20261002]

permissions:
  contents: read

jobs:
  startup:
    name: Startup (${{ matrix.runner }} / ${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            xcode: '26.6'
            runtime: '26.5'
            observer_qos: 'inherited'
            label: stock-icon-service
            icon_fallback: false
          - runner: macos-26-intel
            xcode: '26.6'
            runtime: '26.5'
            observer_qos: 'inherited'
            label: icon-service-fallback
            icon_fallback: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      LOUPE_TOUCH_ARCHITECTURE: x86_64
      LOUPE_TOUCH_RUNTIME_VERSION: ${{ matrix.runtime }}
      LOUPE_TOUCH_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
      PYTHONDONTWRITEBYTECODE: '1'
      LOUPE_HID_DIAGNOSTICS: '1'
      LOUPE_CI_OBSERVER_QOS: ${{ matrix.observer_qos }}
    steps:
      - uses: actions/checkout@v4
      - name: Record native host and pinned toolchain
        run: |
          test "$(uname -m)" = x86_64
          sw_vers
          sysctl hw.ncpu hw.memsize
          xcodebuild -version
      - name: Capture the idle host baseline
        shell: bash
        run: |
          python3 - <<'PYBASE'
          import json, pathlib, subprocess
          root = pathlib.Path('/tmp/loupe-intel-boot-comparison.baseline')
          for name, command in [
              ('processes', ['/bin/ps', '-r', '-axo', 'pid,ppid,pcpu,pmem,state,comm']),
              ('memory', ['/usr/bin/vm_stat']),
              ('iconservice', ['/bin/launchctl', 'print', 'gui/501/com.apple.iconservices.iconservicesagent']),
          ]:
              with root.with_suffix('.' + name + '.log').open('w') as out:
                  try:
                      subprocess.run(command, stdout=out, stderr=subprocess.STDOUT, timeout=5)
                  except subprocess.SubprocessError as error:
                      out.write(str(error) + '\n')
          reports = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          names = [p.name for p in reports.glob('*.ips')]
          root.with_suffix('.crash-reports.json').write_text(json.dumps(names))
          icons = list(reports.glob('iconservicesagent*.ips'))
          if icons:
              latest = max(icons, key=lambda p: p.stat().st_mtime_ns)
              with latest.open('rb') as source:
                  root.with_suffix('.icon-crash.ips').write_bytes(source.read(2 * 1024 * 1024))
          PYBASE
      - name: Use generic host icons on the disposable Intel runner
        if: matrix.icon_fallback
        shell: bash
        run: |
          # Isolated workaround for actions/runner-images#14751. It changes
          # only a crashing host icon service, never the simulator or input.
          python3 - <<'PYICON'
          import os, pathlib, subprocess
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert subprocess.check_output(['uname', '-m'], text=True).strip() == 'x86_64'
          assert subprocess.check_output(['sw_vers', '-productVersion'], text=True).startswith('26.')
          target = f'gui/{os.getuid()}/com.apple.iconservices.iconservicesagent'
          with pathlib.Path('/tmp/loupe-intel-boot-comparison.icon-workaround.log').open('w') as out:
              for args in [('disable', target), ('bootout', target)]:
                  subprocess.run(['launchctl', *args], check=True, stdout=out,
                                 stderr=subprocess.STDOUT, timeout=10)
              subprocess.run(['launchctl', 'print-disabled', f'gui/{os.getuid()}'],
                             check=True, stdout=out, stderr=subprocess.STDOUT, timeout=5)
          PYICON
      - name: Prepare the same exact iOS runtime
        run: python3 scripts/ci-ios-touch-simulator.py create /tmp/loupe-intel-boot-comparison.json
      - name: Remove only the owned fixture
        if: always()
        run: python3 scripts/ci-ios-touch-simulator.py delete /tmp/loupe-intel-boot-comparison.json
      - name: Retain startup records on either outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-startup-${{ matrix.runner }}-${{ matrix.label }}
          if-no-files-found: ignore
          path: /tmp/loupe-intel-boot-comparison*
