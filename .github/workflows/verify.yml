name: Verify
on:
  workflow_dispatch:
jobs:
  swiftui-probe:
    name: Inspect Xcode 27 SwiftUI update exports
    runs-on: xcode-27
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Read simulator exports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/loupe-swiftui-probe
          device="$(xcrun simctl create 'Loupe SwiftUI Exports' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)"
          xcrun simctl bootstatus "$device" -b
          cat > /tmp/loupe-swiftui-probe/loader.c <<'C'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(void) {
           void *handle=dlopen("/System/Library/Frameworks/SwiftUICore.framework/SwiftUICore",RTLD_NOW);
           printf("framework: %p\n",handle);
           const char *names[]={"$s7SwiftUI6UpdateO5beginyyFZ","$s7SwiftUI6UpdateO3endyyFZ","$s11SwiftUICore6UpdateO5beginyyFZ","$s11SwiftUICore6UpdateO3endyyFZ","$s11SwiftUICore6UpdateO4lockyyFZ","$s11SwiftUICore6UpdateO6unlockyyFZ","$s7SwiftUI6UpdateO4lockyyFZ","$s7SwiftUI6UpdateO6unlockyyFZ"};
           for(int i=0;i<8;i++) printf("%s: %p\n",names[i],dlsym(handle,names[i]));
          }
          C
          xcrun clang -target arm64-apple-ios17.0-simulator -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" /tmp/loupe-swiftui-probe/loader.c -o /tmp/loupe-swiftui-probe/LoupeSwiftUIProbe
          xcrun simctl spawn "$device" /tmp/loupe-swiftui-probe/LoupeSwiftUIProbe > /tmp/loupe-swiftui-probe/loader.log 2>&1
          cat /tmp/loupe-swiftui-probe/loader.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loupe-swiftui-probe
          path: /tmp/loupe-swiftui-probe/
