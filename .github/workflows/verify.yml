name: Verify
on:
  workflow_dispatch:
jobs:
  inspect:
    name: Inspect Xcode 27 guest digitizer registration
    runs-on: xcode-27
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Inspect guest HID protocol
        shell: bash
        run: |
          set -euo pipefail
          binary=/Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/Platforms/iphoneos/Library/Frameworks/SimulatorHID.framework/SimulatorHID
          xcrun otool -arch arm64 -tvV "$binary" > /tmp/loupe-xcode27-guest-asm.txt
          xcrun otool -ov "$binary" > /tmp/loupe-xcode27-guest-objc.txt
          strings "$binary" > /tmp/loupe-xcode27-guest-strings.txt
      - uses: actions/upload-artifact@v4
        with:
          name: loupe-xcode27-guest-interface
          path: /tmp/loupe-xcode27-guest-*.txt
