name: Verify
on:
  workflow_dispatch:
jobs:
  swiftui-probe:
    name: Inspect Xcode 27 SwiftUI graph precondition
    runs-on: xcode-27
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Inspect loaded simulator symbols
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/loupe-swiftui-probe
          device="$(xcrun simctl create 'Loupe SwiftUI Symbols' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)"
          xcrun simctl bootstatus "$device" -b
          cat > /tmp/loupe-swiftui-probe/loader.c <<'C'
          #include <dlfcn.h>
          #include <stdio.h>
          #include <unistd.h>
          int main(void) {
            void *handle = dlopen("/System/Library/Frameworks/SwiftUICore.framework/SwiftUICore", RTLD_NOW);
            printf("SwiftUI core loaded %p\n", handle); fflush(stdout);
            sleep(180);
          }
          C
          xcrun clang -target arm64-apple-ios17.0-simulator -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" /tmp/loupe-swiftui-probe/loader.c -o /tmp/loupe-swiftui-probe/LoupeSwiftUIProbe
          xcrun simctl spawn "$device" /tmp/loupe-swiftui-probe/LoupeSwiftUIProbe > /tmp/loupe-swiftui-probe/loader.log 2>&1 &
          sleep 3
          cat > /tmp/loupe-swiftui-probe/inspect.py <<'PY'
          import lldb
          m=next(m for m in lldb.target.module_iter() if m.GetFileSpec().GetFilename()=='SwiftUICore')
          for symbol in m:
              name=symbol.GetName() or ''
              if any(k in name for k in ['syncMainIfReferences', 'ViewGraph.viewDebugData()', 'ViewListTransition.updateValue()', 'Update.begin()', 'Update.end()', 'Update.lock()', 'Update.unlock()']):
                  print(name)
                  print(symbol.GetInstructions(lldb.target))
          PY
          xcrun lldb --batch --attach-name LoupeSwiftUIProbe --one-line 'command script import /tmp/loupe-swiftui-probe/inspect.py' --one-line detach > /tmp/loupe-swiftui-probe/asm.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loupe-swiftui-probe
          path: /tmp/loupe-swiftui-probe/
