name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LOUPE_SIMCTL_LIST_TIMEOUT: "120"
  LOUPE_CI_SIMCTL_LIST_ATTEMPTS: "3"
  LOUPE_SIMCTL_TERMINATE_TIMEOUT: "20"

jobs:
  swiftpm-tests:
    name: SwiftPM Tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: scripts/ci-print-toolchain.sh

      - name: Run SwiftPM tests
        run: swift test

      - name: CI simulator readiness contracts
        run: python3 scripts/test-ci-simulator-readiness.py

  release-and-platform-builds:
    name: Release and Platform Builds
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: scripts/ci-print-toolchain.sh --simulators

      - name: Release CLI build
        run: swift build --configuration release --disable-sandbox --product loupe

      - name: CLI contract checks
        run: python3 scripts/verify-cli-contracts.py .build/release/loupe

      - name: Platform builds
        run: scripts/verify-platform-builds.sh

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loupe-build-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/loupe-*

  macos-e2e:
    name: macOS E2E
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: scripts/ci-print-toolchain.sh

      - name: Run macOS example E2E
        run: scripts/ci-run-with-diagnostics.sh "macOS E2E" Examples/MacLoupeExample/run-macos-e2e.sh

      - name: Upload macOS diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loupe-macos-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/loupe-macos-*
            /tmp/loupe-ci-*

  tvos-e2e:
    name: tvOS E2E
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: scripts/ci-print-toolchain.sh --simulators

      - name: Run tvOS example E2E
        run: scripts/ci-run-with-diagnostics.sh "tvOS E2E" Examples/LoupeTVExample/run-tvos-runtime-e2e.sh

      - name: Upload tvOS diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loupe-tvos-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/loupe-tvos-*
            /tmp/loupe-ci-*

  watchos-e2e:
    name: watchOS E2E
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: scripts/ci-print-toolchain.sh --simulators

      - name: Run watchOS example E2E
        run: scripts/ci-run-with-diagnostics.sh "watchOS E2E" Examples/LoupeWatchExample/run-watchos-runtime-e2e.sh

      - name: Upload watchOS diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loupe-watchos-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/loupe-watchos-*
            /tmp/loupe-ci-*

  ios-injected-e2e:
    name: iOS Injected E2E
    runs-on: macos-26
    timeout-minutes: 30
    env:
      LOUPE_LAUNCH_TIMEOUT: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: scripts/ci-print-toolchain.sh --simulators

      - name: Run injected log E2E
        run: scripts/ci-run-with-diagnostics.sh "iOS Injected E2E" Examples/LoupeExample/run-injected.sh

      - name: Upload iOS injected diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loupe-ios-injected-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/loupe-example-*
            /tmp/loupe-ci-*
            /tmp/loupe-injector-build.log

  ios-runtime-e2e:
    name: iOS Runtime E2E
    runs-on: macos-26
    timeout-minutes: 30
    env:
      LOUPE_LAUNCH_TIMEOUT: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: scripts/ci-print-toolchain.sh --simulators

      - name: Run runtime E2E
        run: scripts/ci-run-with-diagnostics.sh "iOS Runtime E2E" Examples/LoupeExample/run-runtime-e2e.sh

      - name: Upload iOS runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loupe-ios-runtime-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/loupe-runtime-*
            /tmp/loupe-ci-*
            /tmp/loupe-example-build.log
            /tmp/loupe-injector-build.log

  ios-native-e2e:
    name: iOS Native Scenario E2E
    runs-on: macos-26
    timeout-minutes: 35
    env:
      LOUPE_LAUNCH_TIMEOUT: "60"
      LOUPE_EXAMPLE_BUILD_ROOT: "/tmp/loupe-native-shared-build"
      LOUPE_TOUCH_RUNTIME_VERSION: "26.2"
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: scripts/ci-print-toolchain.sh

      - name: Prepare the owned iOS fixture
        run: |
          set -euo pipefail
          python3 scripts/ci-ios-touch-simulator.py create /tmp/loupe-touch-ci-simulator.json
          device="$(python3 -c 'import json; print(json.load(open("/tmp/loupe-touch-ci-simulator.json"))["device"])')"
          echo "LOUPE_DEVICE=$device" >> "$GITHUB_ENV"
          echo "LOUPE_TOUCH_PRECONFIGURED_INPUT=1" >> "$GITHUB_ENV"

      - name: Run native scenario E2E
        run: scripts/ci-run-with-diagnostics.sh "iOS Native Scenario E2E" Examples/LoupeExample/run-native-scenarios.sh

      - name: Run touch gesture E2E
        env:
          LOUPE_HID_DIAGNOSTICS: "1"
        run: scripts/ci-run-with-diagnostics.sh "iOS Touch Gesture E2E" Examples/LoupeExample/run-touch-e2e.sh

      - name: Upload iOS native diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loupe-ios-native-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/loupe-native-*
            /tmp/loupe-touch-*
            /tmp/loupe-ci-*
            /tmp/loupe-example-build.log
            /tmp/loupe-injector-build.log

      - name: Remove the owned touch simulator
        if: always()
        run: python3 scripts/ci-ios-touch-simulator.py delete /tmp/loupe-touch-ci-simulator.json

  ios-bookmark-e2e:
    name: iOS Bookmark E2E
    runs-on: macos-26
    timeout-minutes: 35
    env:
      LOUPE_LAUNCH_TIMEOUT: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: scripts/ci-print-toolchain.sh --simulators

      - name: Run bookmark E2E
        run: scripts/ci-run-with-diagnostics.sh "iOS Bookmark E2E" Examples/LoupeExample/run-bookmark-e2e.sh

      - name: Upload iOS bookmark diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loupe-ios-bookmark-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/loupe-bookmark-*
            /tmp/loupe-ci-*
            /tmp/loupe-example-build.log
            /tmp/loupe-injector-build.log
