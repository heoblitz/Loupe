name: Xcode simulator widget profile comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: widget-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: ${{ matrix.target }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.target == 'source27' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [source27, bottle26]
        profile: [stock, widgets]
    env:
      DEVELOPER_DIR: ${{ matrix.target == 'source27' && '/Applications/Xcode_27.0.app/Contents/Developer' || '/Applications/Xcode_26.3.app/Contents/Developer' }}
      LOUPE_TOUCH_XCODE_VERSION: ${{ matrix.target == 'source27' && '27.0' || '26.3' }}
      LOUPE_TOUCH_RUNTIME_VERSION: ${{ matrix.target == 'source27' && '27.0' || '26.2' }}
      LOUPE_TOUCH_ARCHITECTURE: arm64
      LOUPE_TOUCH_OPEN_DEVICE_HUB: ${{ matrix.target == 'source27' && '1' || '0' }}
      LOUPE_CI_WIDGET_PROFILE: ${{ matrix.profile }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_BOOTSNAP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact final-source artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.target == 'source27' && '38820961020' || '38820961119' }}
          name: ${{ matrix.target == 'source27' && 'loupe-ios27-artifacts-1' || 'loupe-ios26.2-artifacts-1' }}
          path: /tmp/loupe-profile-download
      - name: Use the original source binaries and fixture
        run: |
          set -euo pipefail
          mkdir -p /tmp/loupe-profile-runtime
          tar -xzf /tmp/loupe-profile-download/loupe-ci-ios-artifacts.tar.gz -C /tmp/loupe-profile-runtime
          test "$(cat /tmp/loupe-profile-runtime/source-sha)" = '3b08aac8e73830e822da3ea872949defdf402357'
          echo 'LOUPE_TOUCH_CLI=/tmp/loupe-profile-runtime/loupe' >> "$GITHUB_ENV"
          echo 'LOUPE_EXAMPLE_PREBUILT_APP=/tmp/loupe-profile-runtime/LoupeExample.app' >> "$GITHUB_ENV"
          echo 'LOUPE_EXAMPLE_PREBUILT_INJECTOR=/tmp/loupe-profile-runtime/LoupeInjector' >> "$GITHUB_ENV"
      - name: Download the actual SDK 26 bottle
        if: matrix.target == 'bottle26'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38820961119
          name: loupe-bottles-arm64-1
          path: /tmp/loupe-profile-bottle
      - name: Install the unchanged actual bottle
        if: matrix.target == 'bottle26'
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/heoblitz/homebrew-loupe"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew trust heoblitz/loupe
          bottle="$(find /tmp/loupe-profile-bottle -name '*.bottle.tar.gz' -print -quit)"
          test -n "$bottle"
          HOMEBREW_DEVELOPER=1 brew install --force-bottle "$bottle"
          prefix="$(brew --prefix heoblitz/loupe/loupe)"
          jq -e '.poured_from_bottle == true' "$prefix/INSTALL_RECEIPT.json"
          test "$("$prefix/bin/loupe" --version)" = 'loupe 0.5.1'
          echo "LOUPE_TOUCH_CLI=$prefix/bin/loupe" >> "$GITHUB_ENV"
          echo "LOUPE_EXAMPLE_PREBUILT_INJECTOR=$prefix/libexec/LoupeInjector.framework/LoupeInjector" >> "$GITHUB_ENV"
      - name: Select a shutdown device and apply the experimental widget profile
        run: |
          set -euo pipefail
          source Examples/LoupeExample/build-simulator-artifacts.sh
          configure_loupe_ios_verification
          device="$(loupe_ios_verification_device)"
          echo "LOUPE_DEVICE=$device" >> "$GITHUB_ENV"
          python3 diagnostics/widget-profile.py "$device" prepare
      - name: Verify identical input contracts while recording resources
        run: |
          set -euo pipefail
          python3 -u diagnostics/resources.py > /tmp/loupe-touch-resources.log 2>&1 &
          Examples/LoupeExample/run-touch-e2e.sh
      - name: Read back the profile after input verification
        if: always()
        run: python3 diagnostics/widget-profile.py "$LOUPE_DEVICE" verify
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-profile-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: /tmp/loupe-touch-*
