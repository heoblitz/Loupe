# PoC branch only. Never merge this workflow over the production Verify gate.
name: IDB input PoC
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Common Loupe observer comparison or independent idb-only proof
        default: compare
        type: choice
        options: [compare, standalone]
permissions:
  contents: read
  actions: read
jobs:
  input:
    name: ${{ matrix.target }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.target == 'xcode27' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: xcode26
            profile: stock
          - target: xcode27
            profile: stock
          - target: xcode27
            profile: widgets
    env:
      DEVELOPER_DIR: ${{ matrix.target == 'xcode27' && '/Applications/Xcode_27.0.app/Contents/Developer' || '/Applications/Xcode_26.3.app/Contents/Developer' }}
      LOUPE_TOUCH_XCODE_VERSION: ${{ matrix.target == 'xcode27' && '27.0' || '26.3' }}
      LOUPE_TOUCH_RUNTIME_VERSION: ${{ matrix.target == 'xcode27' && '27.0' || '26.2' }}
      LOUPE_TOUCH_OPEN_DEVICE_HUB: ${{ matrix.target == 'xcode27' && '1' || '0' }}
      LOUPE_TOUCH_ARCHITECTURE: arm64
      LOUPE_EXAMPLE_DESTINATION: generic/platform=iOS Simulator
      IDB_EVIDENCE: /tmp/loupe-idb-evidence
      IDB_COMPANION: /tmp/loupe-idb/bin/idb_companion
      IDB_CLI: /tmp/loupe-idb/venv/bin/idb
      IDB_POC_MODE: ${{ inputs.mode || 'compare' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated official idb 1.7.3
        run: IDB_PYTHON="$(command -v python3)" bash poc/idb/install.sh /tmp/loupe-idb
      - name: Download identical existing fixtures without compiling on the runtime host
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.target == 'xcode27' && '38820961020' || '38820961119' }}
          name: ${{ matrix.target == 'xcode27' && 'loupe-ios27-artifacts-1' || 'loupe-ios26.2-artifacts-1' }}
          path: /tmp/loupe-idb-artifacts
      - name: Use the pinned original fixture and observation binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/loupe-idb-runtime
          tar -xzf /tmp/loupe-idb-artifacts/loupe-ci-ios-artifacts.tar.gz -C /tmp/loupe-idb-runtime
          test "$(cat /tmp/loupe-idb-runtime/source-sha)" = 3b08aac8e73830e822da3ea872949defdf402357
          echo 'LOUPE_TOUCH_CLI=/tmp/loupe-idb-runtime/loupe' >> "$GITHUB_ENV"
          echo 'LOUPE_EXAMPLE_PREBUILT_APP=/tmp/loupe-idb-runtime/LoupeExample.app' >> "$GITHUB_ENV"
          echo 'LOUPE_EXAMPLE_PREBUILT_INJECTOR=/tmp/loupe-idb-runtime/LoupeInjector' >> "$GITHUB_ENV"
      - name: Select exact device and optional existing widget profile
        run: |
          set -euo pipefail
          source Examples/LoupeExample/build-simulator-artifacts.sh
          configure_loupe_ios_verification
          device="$(loupe_ios_verification_device)"
          echo "LOUPE_DEVICE=$device" >> "$GITHUB_ENV"
          if [[ '${{ matrix.profile }}' == widgets ]]; then
            python3 scripts/ci-simulator-widgets.py "$device" prepare
          fi
      - name: Compare native and idb input with identical app-state assertions
        run: bash poc/idb/run.sh
      - name: Upload every result including unsupported capabilities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idb-poc-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_attempt }}
          path: |
            /tmp/loupe-idb-evidence/
            /tmp/loupe-touch-boot.log
            /tmp/loupe-touch-keyboards.*
          if-no-files-found: warn
