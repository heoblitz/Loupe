name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  LOUPE_SIMCTL_LIST_TIMEOUT: "120"
  LOUPE_CI_SIMCTL_LIST_ATTEMPTS: "3"
  LOUPE_SIMCTL_TERMINATE_TIMEOUT: "20"

jobs:
  xcode27-touch-e2e:
    name: Xcode 27 iOS Touch E2E
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      LOUPE_TOUCH_XCODE_VERSION: "27.0"
      LOUPE_TOUCH_RUNTIME_VERSION: "27.0"
      LOUPE_EXAMPLE_BUILD_ROOT: /tmp/loupe-xcode27-touch-build

    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode 27 HID interface
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes
          simulator_kit="$DEVELOPER_DIR/../SharedFrameworks/SimulatorKit.framework/SimulatorKit"
          xcrun nm -gU "$simulator_kit" | xcrun swift-demangle > /tmp/loupe-xcode27-symbols.txt
          xcrun otool -ov "$simulator_kit" > /tmp/loupe-xcode27-objc.txt
          xcrun otool -tvV "$simulator_kit" > /tmp/loupe-xcode27-asm.txt
          xcrun simctl list devices available --json > /tmp/loupe-xcode27-devices.json
          device="$(xcrun simctl create 'Loupe Xcode 27 Touch' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)"
          echo "LOUPE_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Build the simulator injector with SwiftPM
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          args=(--scratch-path /tmp/loupe-xcode27-injector --product LoupeInjector --sdk "$sdk" --triple arm64-apple-ios15.0-simulator)
          swift build "${args[@]}"
          binary_dir="$(swift build "${args[@]}" --show-bin-path)"
          echo "LOUPE_EXAMPLE_PREBUILT_INJECTOR=$binary_dir/libLoupeInjector.dylib" >> "$GITHUB_ENV"
      - name: Verify touch message layout
        run: bash scripts/verify-hid-touch-messages.sh
      - name: Verify iOS touch and input with Xcode 27
        run: Examples/LoupeExample/run-touch-e2e.sh
      - name: Upload Xcode 27 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loupe-xcode27-touch-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/loupe-xcode27-*.txt
            /tmp/loupe-xcode27-devices.json
            /tmp/loupe-touch-evidence-*
            /tmp/loupe-touch-*.log
            /tmp/loupe-example-build.log
            /tmp/loupe-injector-build.log

