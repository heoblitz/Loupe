name: Verify
on:
  workflow_dispatch:
jobs:
  swiftui-probe:
    name: Read Xcode 27 SwiftUI SDK exports
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Read SDK exports
        shell: bash
        run: |
          python3 - <<'SDK'
          import pathlib,subprocess,shutil
          sdk=pathlib.Path(subprocess.check_output(['xcrun','--sdk','iphonesimulator','--show-sdk-path'],text=True).strip())
          out=pathlib.Path('/tmp/loupe-swiftui-sdk');out.mkdir()
          for framework in ['SwiftUICore','SwiftUI']:
              base=sdk/f'System/Library/Frameworks/{framework}.framework'
              shutil.copyfile(base/f'{framework}.tbd',out/f'{framework}.tbd')
              for path in base.glob('Modules/*.swiftmodule/arm64-apple-ios-simulator*.swiftinterface'):
                  shutil.copyfile(path,out/(framework+'-'+path.name))
          SDK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loupe-swiftui-sdk
          path: /tmp/loupe-swiftui-sdk/
