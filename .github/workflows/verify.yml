name: Verify
on:
  workflow_dispatch:
jobs:
  context-ab:
    name: Compare native context executor paths
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      LOUPE_HID_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build baseline and asynchronous native variants
        shell: bash
        run: |
          set -euo pipefail
          swift build --product loupe > /tmp/loupe-context-baseline-build.log 2>&1
          cp .build/debug/loupe /tmp/loupe-context-baseline
          cp diagnostics/AsyncNativeLoupeCLI.swift Sources/LoupeCLI/LoupeCLI.swift
          swift build --product loupe > /tmp/loupe-context-async-build.log 2>&1
          cp .build/debug/loupe /tmp/loupe-context-async
      - name: Boot an isolated simulator
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl create 'Loupe Context AB' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)"
          echo "LOUPE_DEVICE=$device" >> "$GITHUB_ENV"
          python3 - "$device" <<'BOOT'
          import subprocess,sys
          subprocess.run(['xcrun','simctl','bootstatus',sys.argv[1],'-b'],check=True,timeout=180)
          BOOT
      - name: Compare cold native contexts
        run: python3 diagnostics/context-ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loupe-context-ab
          path: /tmp/loupe-context-*
