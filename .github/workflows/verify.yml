name: Verify
on:
  workflow_dispatch:
jobs:
  swiftui-probe:
    name: Read Xcode 27 SwiftUI SDK exports
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Read SDK exports
        shell: bash
        run: |
          python3 - <<'SDK'
          import pathlib,subprocess
          sdk=pathlib.Path(subprocess.check_output(['xcrun','--sdk','iphonesimulator','--show-sdk-path'],text=True).strip())
          output=[]
          for framework in ['SwiftUICore','SwiftUI']:
              path=sdk/f'System/Library/Frameworks/{framework}.framework/{framework}.tbd'
              output.append(str(path))
              output.extend(line for line in path.read_text().splitlines() if any(word in line for word in ['UpdateO', 'syncMainIfReferences', 'viewDebugData']))
          pathlib.Path('/tmp/loupe-swiftui-sdk.txt').write_text('\n'.join(output))
          print('\n'.join(output))
          SDK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loupe-swiftui-sdk
          path: /tmp/loupe-swiftui-sdk.txt
