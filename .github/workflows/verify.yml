name: Verify
on:
  workflow_dispatch:
jobs:
  build-probe:
    name: Diagnose Xcode 27 simulator destination
    runs-on: xcode-27
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build a generic simulator fixture
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project Examples/LoupeExample/LoupeExample.xcodeproj -scheme LoupeExample -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath "$RUNNER_TEMP/loupe-fixture" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > /tmp/loupe-xcode27-build-probe.log 2>&1 &
          build_pid=$!
          for tick in {1..12}; do
            if ! kill -0 "$build_pid" 2>/dev/null; then break; fi
            sleep 10
          done
          if kill -0 "$build_pid" 2>/dev/null; then
            sample "$build_pid" 3 -file /tmp/loupe-xcode27-build-probe-sample.txt || true
            ps -axo pid,ppid,etime,command > /tmp/loupe-xcode27-build-probe-processes.txt
            kill -TERM "$build_pid" || true
            exit 1
          fi
          wait "$build_pid"
          tail -8 /tmp/loupe-xcode27-build-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loupe-xcode27-build-probe
          path: /tmp/loupe-xcode27-build-probe*
