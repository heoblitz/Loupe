name: Verify
on:
  workflow_dispatch:
jobs:
  inspect:
    name: Inspect Xcode 27 HID registration
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Inspect framework
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          binary="$DEVELOPER_DIR/../SharedFrameworks/SimulatorKit.framework/SimulatorKit"
          xcrun nm -gU "$binary" | xcrun swift-demangle > /tmp/loupe-xcode27-symbols.txt
          xcrun otool -ov "$binary" > /tmp/loupe-xcode27-objc.txt
          xcrun otool -tvV "$binary" > /tmp/loupe-xcode27-asm.txt
          xcrun simctl list devices available --json > /tmp/loupe-xcode27-devices.json
      - uses: actions/upload-artifact@v4
        with:
          name: loupe-xcode27-interface
          path: /tmp/loupe-xcode27-*
